<!-- LMS-Safe Progress Bar - Full Width -->
<!-- Blue line extends from left edge to first step, then progress fills between steps, gray to right edge -->

<div
  style="
    position: relative;
    padding: 40px 0;
    font-family:
      -apple-system,
      BlinkMacSystemFont,
      Segoe UI,
      Roboto,
      sans-serif;
  "
>
  <!-- Full width track (gray) -->
  <div
    style="
      position: absolute;
      top: 58px;
      left: 0;
      right: 0;
      height: 0;
      border-bottom: 2px solid #e9eef3;
    "
  >
    &nbsp;
  </div>
  <!-- Left side always blue (from left edge to first step) -->
  <div
    style="
      position: absolute;
      top: 58px;
      left: 0;
      width: calc(50% - 240px);
      height: 0;
      border-bottom: 2px solid #1165ef;
    "
  >
    &nbsp;
  </div>
  <!-- Progress fill between steps - adjust width for progress -->
  <!-- 0% = width:0; 25% = width:calc(480px * 0.25); 50% = width:calc(480px * 0.5); 100% = width:480px -->
  <div
    style="
      position: absolute;
      top: 58px;
      left: calc(50% - 240px);
      width: calc(480px * 0.5);
      height: 0;
      border-bottom: 2px solid #1165ef;
    "
  >
    &nbsp;
  </div>
  <!-- Right side blue only at 100% - remove this div if not complete -->
  <!-- <div style="position:absolute;top:58px;right:0;width:calc(50% - 240px);height:0;border-bottom:2px solid #1165ef;">&nbsp;</div> -->

  <!-- Steps container - centered 600px -->
  <div style="max-width: 600px; margin: 0 auto; position: relative; z-index: 1">
    <div style="display: flex; justify-content: space-between; width: 100%">
      <!-- Step 1 - Completed -->
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 8px;
        "
      >
        <div
          style="
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            border: 2px solid #1165ef;
            background-color: #1165ef;
            color: white;
            cursor: pointer;
          "
        >
          ✓
        </div>
        <span style="font-size: 12px; color: #1165ef">Intro</span>
      </div>
      <!-- Step 2 - Completed -->
