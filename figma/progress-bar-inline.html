<!-- Progress Bar - Inline Version (no style/script tags needed) -->
<!-- Just paste this HTML and it works -->

<div
  id="progress-demo"
  style="
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family:
      -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto,
      sans-serif;
  "
>
  <div
    style="
      position: relative;
      display: flex;
      align-items: flex-start;
      width: 600px;
    "
  >
    <!-- Track -->
    <div
      style="
        position: absolute;
        top: 18px;
        left: 18px;
        right: 18px;
        height: 1.5px;
        background-color: #e9eef3;
      "
    ></div>
    <!-- Fill - adjust width calc for progress (e.g., 50% = 0.5) -->
    <div
      style="
        position: absolute;
        top: 18px;
        left: 18px;
        height: 1.5px;
        background-color: #1165ef;
        width: calc((100% - 36px) * 0.5);
      "
    ></div>
    <!-- Steps -->
    <div
      style="
        position: relative;
        display: flex;
        justify-content: space-between;
        width: 100%;
        z-index: 1;
      "
    >
      <!-- Step 1 - Completed -->
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 8px;
        "
      >
        <div
          style="
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 500;
            border: 1.5px solid #1165ef;
            background-color: #1165ef;
            color: white;
            cursor: pointer;
          "
          onmouseover="this.style.transform = 'scale(1.15)'"
          onmouseout="this.style.transform = 'scale(1)'"
        >
          ✓
        </div>
        <span style="font-size: 12px; color: #1165ef">Intro</span>
      </div>

      <!-- Step 2 - Completed -->
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 8px;
        "
      >
        <div
          style="
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;

            color: white;
            cursor: pointer;
          "
          onmouseover="this.style.transform = 'scale(1.15)'"

          ✓
        </div>
        <span style="font-size: 12px; color: #1165ef">Basics</span>
      </div>

      <!-- Step 3 - Active with substeps -->
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 8px;
        "
      >
        <div
          style="
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 500;
            border: 1.5px solid #1165ef;
            background-color: white;
            color: #1165ef;
          "
        >
          3
        </div>
        <span style="font-size: 12px; color: #1165ef">Advanced</span>
        <!-- Substeps -->
        <div style="display: flex; gap: 6px; margin-top: 6px">
          <div
            style="
              width: 12px;
              height: 12px;
              border-radius: 50%;
              background-color: #1165ef;
              border: 1px solid #1165ef;
            "

          <div
            style="
              width: 12px;
              height: 12px;
              border-radius: 50%;
              background-color: #1165ef;
              border: 1px solid #1165ef;
            "
          ></div>
          <div
            style="
              width: 12px;

            "
          ></div>
          <div

            "
          ></div>
        </div>
      </div>

      <!-- Step 4 - Inactive -->
      <div
        style="

        "
      >
        <div
