<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Progress Bar</title>
    <style>
      .progress-container {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      .progress-bar {
        position: relative;
        display: flex;
        align-items: flex-start;
        width: 480px;
      }

      .progress-track {
        position: absolute;
        top: 18px;
        left: 18px;
        right: 18px;
        height: 1.5px;
        background-color: #e9eef3;
      }

      .progress-fill {
        position: absolute;
        top: 18px;
        left: 18px;
        height: 1.5px;
        background-color: #1165ef;
        width: calc((100% - 36px) * var(--progress, 0) / 100);
        transition: width 0.3s ease;
      }

      .steps {
        position: relative;
        display: flex;
        justify-content: space-between;
        width: 100%;
        z-index: 1;
      }

      .step {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }

      .step-circle {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 500;
        border: 1.5px solid #e9eef3;
        background-color: #e9eef3;
        color: #6c7684;
        transition: all 0.3s ease;
      }

      .step-circle.active {
        border-color: #1165ef;
        background-color: white;
        color: #1165ef;
      }

      .step-circle.completed {
        border-color: #1165ef;
        background-color: #1165ef;
        color: white;
      }

      .step-label {
        font-size: 12px;
        color: #6c7684;
        transition: color 0.3s ease;
      }

      .step-label.active {
        color: #1165ef;
      }
    </style>
  </head>
  <body>
    <div id="progress1"></div>
    <div id="progress2"></div>
    <div id="progress3"></div>

    <script>
      /**
       * Creates a progress bar with configurable steps and labels
       * @param {string} containerId - ID of the container element
       * @param {object} options
       * @param {string[]} options.labels - Array of step labels
       * @param {number} options.progress - Progress percentage (0-100)
       * @param {number} [options.currentStep] - Current active step (1-based), auto-calculated from progress if not provided
       */
      function createProgressBar(
        containerId,
        { labels, progress, currentStep },
      ) {
        const container = document.getElementById(containerId);
        if (!container) return;

        const totalSteps = labels.length;

        // Auto-calculate current step from progress if not provided
        if (currentStep === undefined) {
          currentStep = Math.ceil((progress / 100) * totalSteps) || 1;
          if (progress === 100) currentStep = totalSteps;
        }

        const stepsHtml = labels
          .map((label, i) => {
            const stepNum = i + 1;
            const isCompleted =
              stepNum < currentStep ||
              (progress === 100 && stepNum === totalSteps);
            const isActive = stepNum === currentStep && progress < 100;

            const circleClass = isCompleted
              ? "completed"
              : isActive
                ? "active"
                : "";
            const labelClass = stepNum <= currentStep ? "active" : "";
            const circleContent = isCompleted ? "✓" : stepNum;

            return `
          <div class="step">
            <div class="step-circle ${circleClass}">${circleContent}</div>
            <span class="step-label ${labelClass}">${label}</span>
          </div>
        `;
          })
          .join("");

        container.innerHTML = `
        <div class="progress-container">
          <div class="progress-bar" style="--progress: ${progress}">
            <div class="progress-track"></div>
            <div class="progress-fill"></div>
            <div class="steps">
              ${stepsHtml}
            </div>
          </div>
        </div>
      `;
      }

      // Example usage:

      // 3 steps at 33%
      createProgressBar("progress1", {
        labels: ["Start", "Middle", "End"],
        progress: 33,
      });

      // 5 steps at 60%
      createProgressBar("progress2", {
        labels: ["Intro", "Lesson", "Quiz", "Review", "Complete"],
        progress: 60,
      });

      // 4 steps at 100%
      createProgressBar("progress3", {
        labels: ["Upload", "Process", "Verify", "Done"],
        progress: 100,
      });
    </script>
  </body>
</html>
